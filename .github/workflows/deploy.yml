name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

# Render is configured with autoDeploy:false (see render.yaml).
# The blueprint's preDeployCommand runs Alembic migrations against the new image
# and aborts the deploy on a non-zero exit.

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy (API)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_API not set — skipping API deploy trigger" >&2
            exit 1
          fi
          curl -fsS "$HOOK" && echo "API deploy triggered"

      - name: Notify Sentry
        if: always()
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          [ -z "$SENTRY_AUTH_TOKEN" ] && { echo "No Sentry token — skipping"; exit 0; }
          curl -sL https://sentry.io/api/0/organizations/${{ secrets.SENTRY_ORG }}/releases/ \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"version":"${{ github.sha }}","projects":["listingjet"]}' || true
