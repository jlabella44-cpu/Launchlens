services:
  # ── PostgreSQL (dev) ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: listingjet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: listingjet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listingjet"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (test — port 5433 for backward compat) ───────
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: listingjet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: listingjet_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listingjet"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── ListingJet API (runs the pipeline worker in-process) ──────
  api:
    build: .
    command: api
    environment:
      - DATABASE_URL=postgresql+asyncpg://listingjet:password@postgres:5432/listingjet
      - DATABASE_URL_SYNC=postgresql://listingjet:password@postgres:5432/listingjet
      - JWT_SECRET=docker-dev-secret-change-in-production-xxxxx
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - USE_MOCK_PROVIDERS=true
      - WORKER_ENABLED=true
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  pgdata_test:
